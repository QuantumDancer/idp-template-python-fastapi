apiVersion: idp.rottler.io/v1alpha1
kind: ApplicationEnvironment
metadata:
  name: ${{ values.teamName }}-${{ values.system }}-${{ values.slug }}
  annotations:
    # Ensure ApplicationEnvironment is deleted before ArgoCD project
    argocd.argoproj.io/sync-wave: "1"
  labels:
    idp.rottler.io/team: ${{ values.teamName }}
    idp.rottler.io/system: ${{ values.system }}
    idp.rottler.io/component: ${{ values.slug }}
spec:
  team: ${{ values.teamName }}
  # Set per cluster by the idp-argocd-user-apps Helm chart (one of homelab,
  # development, production). Single-brace Helm syntax passes through Backstage's
  # nunjucks renderer untouched. The XRD requires this field.
  environment: {{ .Values.environment }}
  system: ${{ values.system }}
  component: ${{ values.slug }}
