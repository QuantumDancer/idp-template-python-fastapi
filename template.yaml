# yaml-language-server: $schema=https://json.schemastore.org/catalog-info.json
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-fastapi
  title: Python FastAPI Service
  description: Backend API based on Python and FastAPI
spec:
  owner: group:platform
  type: service

  parameters:
    - title: Service Details
      required:
        - name
        - system
        - description
        - owner
        - visibility
      properties:
        name:
          title: Service Name
          type: string
          description: >
            Human-readable display name, e.g. "Order Management". Spaces and hyphens are allowed.
            The scaffolder lowercases the name and replaces spaces with dashes to derive the slug (e.g. "order-management").
            CamelCase is not auto-converted, use space-separated words instead.
          pattern: "^[a-zA-Z][a-zA-Z0-9 -]*$"
          ui:autofocus: true
        system:
          title: System
          type: string
          description: >
            The Backstage system this component belongs to (kebab-case, e.g. "orders").
            Must match an existing System entity in the catalog.
          pattern: "^[a-z][a-z0-9-]*$"
        description:
          title: Description
          type: string
          description: Short description of what this service does
        hostname:
          title: Hostname
          type: string
          description: >
            Subdomain used for all environments. Must be lowercase, letters, digits, and hyphens only.
            The environment suffix is appended automatically:
            homelab → <hostname>.k8s.home.rottlr.de,
            development → <hostname>.dev.idp.rottlr.de,
            production → <hostname>.prod.idp.rottlr.de.
          pattern: "^[a-z][a-z0-9-]*$"
        exposure:
          title: Exposure
          type: string
          description: >
            How this service claims its hostname. "Standalone" owns the whole host.
            "Behind a frontend" serves only the /api subtree, so a React SPA on the SAME
            hostname can own / — that SPA's WebService takes path: / and this one takes
            path: /api (Gateway API routes the more specific prefix first). Either way the
            API is reachable at <hostname>/api/v1/... (the app mounts its router at /api/v1).
            Pick "Behind a frontend" only when an SPA shares this exact hostname.
          enum:
            - standalone
            - behind-frontend
          enumNames:
            - Standalone (owns its hostname)
            - Behind a frontend (shares the hostname, serves /api)
          default: standalone
        owner:
          title: Owner Team
          type: string
          description: The team responsible for this service
          ui:field: OwnerPicker
          ui:options:
            # Only catalog Groups are valid owners for internal services
            allowArbitraryValues: false
            catalogFilter:
              kind: Group
        visibility:
          title: Repository Visibility
          type: string
          enum:
            - public
            - internal
            - private
          default: internal

  steps:
    # Step 1: Apply template variables to the application skeleton
    - id: fetch-template
      name: Fetch application skeleton
      action: fetch:template
      input:
        url: ./app
        values:
          name: ${{ parameters.name }}
          # Lowercase slug; spaces → dashes (e.g. "Order Management" → "order-management")
          slug: ${{ parameters.name | lower | replace(" ", "-") }}
          # Canonical component ID following the <system>-<component> repo naming convention
          componentId: ${{ parameters.system }}-${{ parameters.name | lower | replace(" ", "-") }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          # Strip the Backstage entity ref prefix to get the bare team name (group:default/team-a → team-a).
          # OK, because we are in a single-tenant environment.
          teamName: ${{ parameters.owner | replace("group:default/", "") }}

    # Step 2: Create the GitLab app repository and push the scaffolded code
    - id: publish-gitlab
      name: Publish to GitLab
      action: publish:gitlab
      input:
        # Repository is created at idp/<team>/<system>-<component> per IDP conventions.
        # %2F is required to encode the / separator inside a URL query-string value.
        repoUrl: "gitlab.home.rottlr.de?owner=idp%2F${{ parameters.owner | replace('group:default/', '') }}&repo=${{ parameters.system }}-${{ parameters.name | lower | replace(' ', '-') }}"
        defaultBranch: main
        repoVisibility: ${{ parameters.visibility }}
        gitCommitMessage: "feat: initial scaffolding from Backstage template"
        settings:
          ci_config_path: ".gitlab-ci.yml"

    # Step 3: Apply template variables to the deployment (Helm chart) skeleton
    - id: fetch-deployment-template
      name: Fetch deployment skeleton
      action: fetch:template
      input:
        url: ./deployment
        targetPath: ./deployment-output
        values:
          name: ${{ parameters.name }}
          slug: ${{ parameters.name | lower | replace(" ", "-") }}
          componentId: ${{ parameters.system }}-${{ parameters.name | lower | replace(" ", "-") }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          teamName: ${{ parameters.owner | replace("group:default/", "") }}
          hostname: ${{ parameters.hostname }}
          # PathPrefix the WebService claims on its hostname (expose.path):
          # standalone owns "/", "behind a frontend" serves only "/api".
          exposePath: ${{ "/api" if parameters.exposure == "behind-frontend" else "/" }}

    # Step 4: Create the GitLab deployment repo and push the scaffolded Helm chart
    - id: publish-deployment-gitlab
      name: Publish deployment repo to GitLab
      action: publish:gitlab
      input:
        # Deployment repo follows the <system>-<component>-deployment naming convention.
        repoUrl: "gitlab.home.rottlr.de?owner=idp%2F${{ parameters.owner | replace('group:default/', '') }}&repo=${{ parameters.system }}-${{ parameters.name | lower | replace(' ', '-') }}-deployment"
        sourcePath: ./deployment-output
        defaultBranch: development
        repoVisibility: ${{ parameters.visibility }}
        gitCommitMessage: "feat: initial scaffolding from Backstage template"

    # Step 5: Render the ApplicationEnvironment CR for the idp-argocd-user-apps GitOps repo.
    # This CR is picked up by Crossplane to provision the namespaces and environment resources
    # the new service needs in each target cluster.
    - id: fetch-environment-template
      name: Fetch ApplicationEnvironment skeleton
      action: fetch:template
      input:
        url: ./environment/
        targetPath: ./environment-output
        values:
          teamName: ${{ parameters.owner | replace("group:default/", "") }}
          system: ${{ parameters.system }}
          slug: ${{ parameters.name | lower | replace(" ", "-") }}

    # Step 6: Push the rendered CR directly to main in idp-argocd-user-apps.
    # Direct push to main is intentional: the CR is fully parameterised and idempotent,
    # and requiring a human MR approval would block the automated provisioning flow.
    - id: publish-application-environment
      name: Register ApplicationEnvironment in GitOps repo
      action: gitlab:repo:push
      input:
        repoUrl: "gitlab.home.rottlr.de?owner=idp%2Fplatform&repo=idp-argocd-user-apps"
        sourcePath: ./environment-output
        branchName: main
        commitMessage: "feat: register ${{ parameters.system }}-${{ parameters.name | lower | replace(' ', '-') }} ApplicationEnvironment"

    # Step 7: Register the new component in the Backstage software catalog
    - id: register-catalog
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-gitlab'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish-gitlab'].output.remoteUrl }}
      - title: Deployment Repository
        url: ${{ steps['publish-deployment-gitlab'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
