apiVersion: v1
kind: Service
metadata:
  name: {{ include "${{ values.componentId }}.fullname" . }}
  labels:
    {{- include "${{ values.componentId }}.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "${{ values.componentId }}.selectorLabels" . | nindent 4 }}
