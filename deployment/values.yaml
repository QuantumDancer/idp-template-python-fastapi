# Base values for the ${{ values.name }} WebService.
#
# This chart renders a single idp.rottler.io/v1alpha1 WebService custom resource.
# Everything that is identical across environments (image repository, port, compute
# tier, hostname, static env) is hard-coded in templates/webservice.yaml. Only the
# values that differ per environment live here and are overridden by the deep-merged
# environments/<env>.yaml overlays.

# Set per environment overlay (homelab | development | production). Selects the
# cluster base domain for the hostname and is injected as the ENVIRONMENT env var.
environment: ""

image:
  # Always overridden in environments/*.yaml by the CI pipeline on deploy.
  tag: ""

otel:
  # OTLP/gRPC collector endpoint (port 4317). Tracing is disabled when empty.
  endpoint: "http://k8s-monitoring-alloy-receiver.k8s-monitoring.svc.cluster.local:4317"
  serviceName: "${{ values.componentId }}"

# Replica bounds. min == max (or max omitted) → fixed replicas; min < max → CPU HPA.
# A PodDisruptionBudget is composed automatically when min >= 2.
scaling:
  min: 2
